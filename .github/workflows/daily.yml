name: Daily AI Job Headhunter

on:
  schedule:
    - cron: '17 3 * * *'   # Runs at 8:47 AM IST every day
    - cron: '17 13 * * *'  # Runs at 6:47 PM IST every day
  workflow_dispatch:       # Lets you click a button to run manually anytime

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install requests python-docx
      - name: Refresh 1,000 Company Directory
        run: python discover_companies.py
      - name: Run Executive Research Headhunter
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESUME_CONTACT_HEADER: ${{ secrets.RESUME_CONTACT_HEADER }}
        run: python hunter.py
      - name: Save Memory & Company List
        run: |
          git config user.name "JobHunterBot"
          git config user.email "bot@users.noreply.github.com"
          [ -f seen_jobs.json ] && git add seen_jobs.json
          [ -f companies.csv ] && git add companies.csv
          git commit -m "Update seen jobs and 1000 companies" || exit 0
          git pull --rebase origin main
          git push
