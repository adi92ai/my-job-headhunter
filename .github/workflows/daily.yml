name: Daily AI Job Headhunter

on:
  schedule:
    - cron: '30 2 * * *' # Runs automatically at 8:00 AM IST every day
  workflow_dispatch:       # Lets you click a button to run it manually anytime

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run AI Job Hunter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python hunter.py
      - name: Save Seen Jobs Memory
        run: |
          git config user.name "JobHunterBot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "Update seen jobs" || exit 0
          git push
